name: Astro Tracker Automation

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install swisseph flatlib google-api-python-client google-auth-httplib2 google-auth-oauthlib requests

      - name: Create credentials file
        run: |
          echo '${{secrets.CREDENTIALS_JSON}}' > credentials.json

      - name: Run Tracker
        env:
          TELEGRAM_TOKEN: ${{secrets.TELEGRAM_TOKEN}}
          TELEGRAM_CHAT_ID: ${{secrets.TELEGRAM_CHAT_ID}}
        run: |
          python astro.tracker.py
          python navtara.tracker.py
          python nishit.navtara.py
          python uttarabhadrapad.tracker.py

      - name: Commit updated history
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add alert_history.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update alert history file" && git push)