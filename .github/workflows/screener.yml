name: Daily Nifty 200 Screener & Telegram Alert

on:
  schedule:
    # IST સવારે 09:45 AM (UTC 04:15 AM)
    - cron: '15 4 * * 1-5'
    # IST બપોરે 03:00 PM (UTC 09:30 AM)
    - cron: '30 9 * * 1-5'

  # Manual Run Option from GitHub UI (બિલકુલ ડાબી બાજુથી શરૂ થવું જોઈએ)
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Screener Script
        run: python main_screener.py