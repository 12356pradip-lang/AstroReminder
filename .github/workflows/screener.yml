name: Weekly & Daily Nifty 200 Screener & Telegram Alert

on:
  schedule:
    # 1. IST સવારે 10:00 AM (UTC 04:30 AM)
    - cron: '30 4 * * 1-5'
    
    # 2. IST બપોરે 01:30 PM (UTC 08:00 AM)
    - cron: '0 8 * * 1-5'
    
    # 3. IST બપોરે 03:00 PM (UTC 09:30 AM)
    - cron: '30 9 * * 1-5'
    
  # Manual Run Option from GitHub UI
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Screener Script (Weekly)
        env:
          TELEGRAM_TOKEN_PRADIP: ${{ secrets.TELEGRAM_TOKEN_PRADIP }}
          TELEGRAM_CHAT_ID_PRADIP: ${{ secrets.TELEGRAM_CHAT_ID_PRADIP }}
        run: python main_screener.py || true

      - name: Run Day Screener Script (Daily)
        env:
          TELEGRAM_TOKEN_PRADIP: ${{ secrets.TELEGRAM_TOKEN_PRADIP }}
          TELEGRAM_CHAT_ID_PRADIP: ${{ secrets.TELEGRAM_CHAT_ID_PRADIP }}
        run: python day_screener.py || true