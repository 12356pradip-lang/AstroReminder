name: Daily Nifty 200 Screener & Telegram Alert

on:
  schedule:
    # IST 09:45 AM = UTC 04:15 AM (Monday to Friday)
    - cron: '15 4 * * 1-5'
    # IST 03:00 PM = UTC 09:30 AM (Monday to Friday)
    - cron: '30 9 * * 1-5'
  
  # Manual Run Option from GitHub UI
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pyyaml numpy requests

      - name: Run Nifty 200 Screener
        run: |
          python main_screener.py