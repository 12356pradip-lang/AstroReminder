name: Sun Moon Tracker Daily Run

on:
  schedule:
    # દરરોજ સવારે 08:00 AM IST (જે UTC મુજબ રાત્રે 02:30 થાય છે) પર રન થશે
    - cron: '30 2 * * *'
  
  # જાતે (Manual) રન કરવા માટેનો વિકલ્પ
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
    - name: Repository ચેકઆઉટ કરી રહ્યા છીએ
      uses: actions/checkout@v4

    - name: Python સેટઅપ કરી રહ્યા છીએ
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: જરૂરી લાઈબ્રેરીઓ (Swisseph અને Requests) ઇન્સ્ટોલ કરી રહ્યા છીએ
      run: |
        python -m pip install --upgrade pip
        pip install pyswisseph requests

    - name: sunmoon.tracker.py પ્રોગ્રામ ચાલુ કરી રહ્યા છીએ
      env:
        TELEGRAM_TOKEN_PRADIP: ${{ secrets.TELEGRAM_TOKEN_PRADIP }}
        TELEGRAM_CHAT_ID_PRADIP: ${{ secrets.TELEGRAM_CHAT_ID_PRADIP }}
      run: |
        python sunmoon.tracker.py
