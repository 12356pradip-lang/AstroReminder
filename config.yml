# 1. Telegram Details (કૃપા કરીને તમારો Token અને Chat ID અહીં મુકો)
telegram:
  bot_token: "8731134888:AAGHEul75rh6HZBefn7WCrbXUCyBqJ_zeXU"
  chat_id: "478006282"

# 2. Historical Data Settings
data_settings:
  period: "max"        # 5 વર્ષથી વધારીને max (તમામ ઉપલબ્ધ ડેટા) કરેલ છે
  interval: "1wk"

# 3. Technical Parameters
technical_criteria:
  ema_fast: 20
  ema_mid: 50
  ema_slow: 200
  junction_threshold: 0.03
  rsi_min: 40
  rsi_max: 70

# 4. Fundamental & Valuation Criteria
fundamental_criteria:
  min_roe: 15.0
  max_debt_equity: 1.0
  min_promoter: 45.0
  min_rev_growth: 10.0
  min_profit_growth: 10.0
  require_fa_growth: true
  require_fair_valuation: true   # Intrinsic Value થી સસ્તો સ્ટોક ચેક કરશે

# 5. Score Pass Logic
scoring_rules:
  min_score_pass: 9             # Intrinsic Value ઉમેરાતા કૂલ સ્કોર 10 માંથી ગણાશે
  watch_score_pass: 7

