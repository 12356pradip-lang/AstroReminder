# Strict Trading System Configuration for Nifty 200

data_settings:
  period: "5y"           # 5-Year data for Stable Weekly EMA 200 & Fixed Assets
  interval: "1wk"        # Weekly chart for Correction End detection

technical_criteria:
  ema_fast: 20           # Fast EMA
  ema_mid: 50            # Mid EMA
  ema_slow: 200          # Major Support EMA
  junction_threshold: 0.025 # Strict 2.5% limit for EMA Squeeze / Junction
  rsi_min: 50.0          # Strong Bullish Weekly RSI (Increased from 45)
  rsi_max: 68.0

fundamental_criteria:
  min_roe: 18.0          # Strict Min Return on Equity (Increased to 18%)
  max_debt_equity: 0.3   # Low Debt limit (Reduced to 0.3)
  min_promoter: 50.0     # Min Promoter Holding (%)
  min_rev_growth: 10.0   # Min Revenue Growth (%)
  min_profit_growth: 12.0 # Min Profit Growth (%)
  require_fa_growth: true # Fixed Assets Growth mandatory

scoring_rules:
  min_score_pass: 8      # Extreme Strict: Min Score 8/9 for Strong Buy!
  watch_score_pass: 7    # Score 7 for Watchlist

