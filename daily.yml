# ==============================================================================
# DAILY.YML - Configuration File (Daily Timeframe)
# Technical (6 Marks): 125-150 Days Consolidation + Daily Super Junction + 
#                      Bottom Reversal + RSI 60 Breakout (60-63) + Daily 200 EMA + Fib
# Fundamental (6 Marks): ROE, D/E, Promoter, Rev/Profit Growth + CWIP Expansion
# Scoring Criteria: Total 12 Marks Pass Pipeline
# ==============================================================================

# 1. Telegram Alert Credentials (Handled via GitHub Secrets)
telegram:
  bot_token: ""  # Passed via GitHub Secret: TELEGRAM_TOKEN_PRADIP
  chat_id: ""    # Passed via GitHub Secret: TELEGRAM_CHAT_ID_PRADIP

# 2. Historical Data Fetch Settings (Daily Setup)
data_settings:
  period: "max"
  interval: "1d"

# 3. Technical Analysis Parameters
technical_criteria:
  ema_20: 20
  ema_55: 55
  ema_200: 200
  junction_threshold: 0.025   # 2.5% Spread Range for EMA Super Junction
  rsi_min: 60.0               # RSI 60+ Breakout Min Threshold
  rsi_max: 63.0               # RSI Upper Limit Range
  consolidation_days: 150     # Lookback window for daily top check

# 4. Fundamental Criteria (6 Marks Setup)
fundamental_criteria:
  min_roe: 12.0                # Minimum ROE %
  max_debt_equity: 1.0        # Maximum Debt to Equity Ratio
  min_promoter: 40.0          # Minimum Promoter Holding %
  min_rev_growth: 5.0         # Minimum YoY Revenue Growth %
  min_profit_growth: 5.0      # Minimum YoY Profit Growth %
  
  # CWIP Capex Expansion Criteria
  cwip_rule:
    consistent_years: 3       # 3 consecutive years of YoY CWIP expansion

# 5. Scoring & Decision Thresholds (Total 12 Marks Pipeline)
scoring_rules:
  min_score_pass: 8           # Score >= 8/12 -> 🔥 STRONG BUY Alert (DAILY)
  watch_score_pass: 6         # Score 6 or 7/12 -> 👀 WATCHLIST Alert (DAILY)

